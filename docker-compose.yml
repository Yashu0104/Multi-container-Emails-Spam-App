version: '3'

services:
  frontend:
    build:
      context: ./spam-sniffer
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_BACKEND_URL=http://backend:5000
    networks:
      - spam-sniffer-network

  backend:
    build:
      context: ./spam-sniffer-backend
    ports:
      - "5000:5000"
    volumes:
      - ./spam-sniffer-backend:/app
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - MONGO_URI=mongodb://mongo:27017/spam-sniffer-db  # MongoDB URI
    depends_on:
      - mongo
    networks:
      - spam-sniffer-network

  mongo:
    image: mongo:latest
    volumes:
      - ./data/db:/data/db
    ports:
      - "27017:27017"
    networks:
      - spam-sniffer-network

networks:
  spam-sniffer-network:
    driver: bridge
